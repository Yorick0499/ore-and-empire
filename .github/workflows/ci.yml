name: Colony checks
on:
  push:
    branches: [main, feature/playable-colony]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation builder
        run: python -m pip install -r requirements-docs.txt
      - name: Verify standalone public documentation and local links
        run: python scripts/build_public_docs.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: ore-and-empire-publiczna-dokumentacja
          path: docs/dokumentacja.html
          retention-days: 14

  django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      SECRET_KEY: ci-only-key-never-use-in-production
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate offline content packs
        run: python manage.py validate_content
      - name: Run gameplay and interface tests
        run: python manage.py test --noinput
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - uses: actions/upload-artifact@v4
        with:
          name: colony-static-python-${{ matrix.python-version }}
          path: staticfiles/
          retention-days: 7

  complete-journey:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: isolated-journey-ci-only
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Colony to real Barrier activation, NK and repeatable patrols
        run: python manage.py simulate_journey --report work/complete-journey.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-journey-report
          path: work/complete-journey.json
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ore_ci
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: ore_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ore_ci -d ore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-never-use-in-production
      DEBUG: 'False'
      ORE_DATABASE_ENGINE: postgresql
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: ore_ci
      PGPASSWORD: ci-only-database-password
      PGDATABASE: ore_ci
      PG_TOOLS_DIRECTORY: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install matching PostgreSQL tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: PostgreSQL gameplay regression
        run: python manage.py test characters.test_regional_endgame characters.test_complete_journey characters.test_gothic2_content characters.test_gothic2_world characters.test_nk_equipment characters.test_jarkendar characters.test_faction_advancement characters.test_bot_inventory characters.test_faction_choice characters.test_faction_succession characters.test_rank_paths characters.test_progression_balance characters.test_barrier_admin characters.test_barrier characters.test_bot_population characters.test_convergence characters.test_khorinis characters.test_new_progression characters.test_playability_audit characters.test_camps characters.test_adventure_variety characters.test_solo_playability characters.test_rarity characters.test_item_protection characters.test_market_browse characters.test_equipment_comparison characters.test_equipment characters.test_magic characters.test_endgame characters.test_story_quests characters.test_campaign characters.test_camp_guilds characters.test_camp_raids characters.test_economy_balance characters.test_market_policy characters.test_market_intelligence characters.test_bot_personalities characters.test_bot_cycle_simulation characters.test_production --noinput
      - name: Real contention and mixed player/bot load
        run: python manage.py simulate_concurrency --report work/postgresql-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-concurrency-report
          path: work/postgresql-ci.json

  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production WSGI image and hashed static files
        run: docker build -t ore-empire-check .
      - name: Validate HTTPS proxy configuration
        run: docker run --rm -e ORE_DOMAIN=colony.example.test -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
