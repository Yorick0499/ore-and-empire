name: Colony checks
on:
  push:
    branches: [main, feature/playable-colony]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      SECRET_KEY: ci-only-key-never-use-in-production
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check model migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate offline content packs
        run: python manage.py validate_content
      - name: Run gameplay and interface tests
        run: python manage.py test --noinput
      - name: Collect static assets
        run: python manage.py collectstatic --noinput
      - uses: actions/upload-artifact@v4
        with:
          name: colony-static-python-${{ matrix.python-version }}
          path: staticfiles/
          retention-days: 7

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ore_ci
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: ore_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ore_ci -d ore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key-never-use-in-production
      DEBUG: 'False'
      ORE_DATABASE_ENGINE: postgresql
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: ore_ci
      PGPASSWORD: ci-only-database-password
      PGDATABASE: ore_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: PostgreSQL gameplay regression
        run: python manage.py test characters.test_equipment characters.test_magic characters.test_endgame characters.test_story_quests characters.test_campaign characters.test_camp_guilds characters.test_camp_raids characters.test_economy_balance characters.test_market_policy --noinput
      - name: Real contention and mixed player/bot load
        run: python manage.py simulate_concurrency --report work/postgresql-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: postgresql-concurrency-report
          path: work/postgresql-ci.json
