{% if owned.upgrade_cost %}{% with cost=owned.upgrade_cost %}<form method="post" class="upgrade-form">{% csrf_token %}<input type="hidden" name="item_id" value="{{ owned.pk }}"><input type="hidden" name="request_key" value="{{ request_key }}"><input type="hidden" name="expected_level" value="{{ owned.upgrade_level }}"><button name="action" value="improve">Ulepsz do +{{ cost.level }} · {{ cost.ore }} rudy i {{ cost.dust }} pyłu</button></form>{% endwith %}{% endif %}
{% if not owned.is_equipped and owned.blueprint.catalog_key|slice:':12' == 'colony-loot-' %}<form method="post">{% csrf_token %}<input type="hidden" name="item_id" value="{{ owned.pk }}"><input type="hidden" name="request_key" value="{{ request_key }}"><button name="action" value="salvage">Rozbierz na pył (zużywa przedmiot)</button></form>{% endif %}
